version: '3.8'

services:
  # 1. Cloudflare Tunnel: Bypass CGNAT tanpa IP Publik & Port Forwarding
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: kryphix-tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    networks:
      - kryphix-net

  # 2. Caddy Reverse Proxy & Host Header Routing
  caddy:
    image: caddy:2-alpine
    container_name: kryphix-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - kryphix-net
    depends_on:
      - app

  # 3. Next.js 15 Core Web App (Public & Nexus Admin Engine)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kryphix-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-kryphix_admin}:${DB_PASSWORD:-kryphix_secret_pass_2026}@postgres:5432/${DB_NAME:-kryphix_prod}?schema=public
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_URL=https://kryphix.my.id/storage
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-kryphix_minio_user}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-kryphix_minio_secret_2026}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-kryphix-vault-blobs}
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY:-SB-Mid-server-XXXXX}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY:-SB-Mid-client-XXXXX}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      - NEXT_PUBLIC_BASE_URL=https://kryphix.my.id
      - NEXT_PUBLIC_ADMIN_URL=https://nexus-console.kryphix.my.id
      - MASTER_ADMIN_PUBLIC_KEY=${MASTER_ADMIN_PUBLIC_KEY}
      - ADMIN_IP_WHITELIST=${ADMIN_IP_WHITELIST:-127.0.0.1,::1}
      - SESSION_SECRET=${SESSION_SECRET:-kryphix_session_secret_change_me_in_prod_2026}
    networks:
      - kryphix-net
    depends_on:
      - postgres
      - redis

  # 4. Database PostgreSQL 16+
  postgres:
    image: postgres:16-alpine
    container_name: kryphix-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-kryphix_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-kryphix_secret_pass_2026}
      - POSTGRES_DB=${DB_NAME:-kryphix_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kryphix-net

  # 5. In-Memory Cache & Pub/Sub Redis 7+
  redis:
    image: redis:7-alpine
    container_name: kryphix-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - kryphix-net

  # 6. MinIO Local S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: kryphix-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-kryphix_minio_user}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-kryphix_minio_secret_2026}
    volumes:
      - miniodata:/data
    networks:
      - kryphix-net

networks:
  kryphix-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:

